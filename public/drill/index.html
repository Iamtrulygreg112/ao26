<style>
/* Layout: one study column; sticky section rail on top; each section = mode picker + one active drill card */

.ini{font-family:var(--f-mono);font-size:16px;letter-spacing:.06em}
.diff .ok{color:var(--good)}

.chunks{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.chunks button{font:500 12px var(--f-mono);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer}
.chunks button[aria-pressed="true"]{border-color:var(--azure);color:var(--azure)}
.order-slots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.slot{min-width:92px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;text-align:center;font-weight:600;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--good);color:var(--ink);background:var(--good-soft)}
.hint{font-size:13px;color:var(--muted)}
.big{font-family:var(--f-mono);font-size:28px}
.fact{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:15px}
.fact dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact dd{margin:0 0 6px;font-weight:500}
.split{display:grid;gap:12px}
@media (min-width:620px){.split{grid-template-columns:1fr 1fr}}
.min0{min-width:0}
@media (max-width:420px){.mrow{grid-template-columns:96px 1fr 40px}.fact{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.opt,.btn{transition:background .15s,border-color .15s}}
</style>

<script>

 {name:"Xi", m:`Anish Raman|Data Science|Redondo Beach

 {name:"Nu", m:`Aaron Rome|Civil Engineering|El Cerrito

Caedin Sikora|Undeclared|Connecticut

 {name:"Mu", m:`Aaron Reimer|Economics|Fresno

Matthew Pitcher|History + Polisci|Fresno

Will Marsh|Applied Math|Menlo Park`},
 {name:"Lambda", m:`Alex Stankus|EECS|Palm Springs
Alex Wight|Economics|Washington D.C.
Brandon Fraser|Applied Math|OC
Devan Elson|MCB|Davis
Diego Jimenez|Political Econ|San Pedro
Elliot Rosin|Economics|LA
Ethan Lin|Applied Math|OC
John Mathison|Economics|SD
Logan Hardy|Business|OC
Mateo Espinoza|History|Palo Alto
Raj Boparai|CS|New Jersey
Rishi Sinha|EECS|San Jose
Rohan Panchal|Economics|Los Altos
Rory Bushong|Economics|Indiana
Ryder Dittman|Undecided|Tahoe
Vishaal Krishan|Business|OC`}
].map(c=>({name:c.name, members:c.m.split("\n").map(l=>{const [n,maj,home]=l.split("|");return {name:n.trim(),major:(maj||"").trim(),home:(home||"").trim(),cls:c.name}})}));
const ORDER = CLASSES.map(c=>c.name); // newest → oldest
const ALL = CLASSES.flatMap(c=>c.members);

const EXEC = [
 ["President",["Alex Wight"]],["VP",["Rohan Panchal"]],["Secretary",["Elliot Rosin"]],
 ["Brotherhood",["Diego Jimenez"]],["Treasurer",["Alex Stankus"]],
 ["Rush",["Kavi Seidman","Aaron Reimer","Henry Leavenworth"]],["Risk",["Justin Tella","Mason Morris"]],
 ["Social",["Henry Crabtree","Nizhoni Deschene","Aaron Rome"]],["Housing Manager",["Mateo Espinoza"]],
 ["Alumni",["Logan Hardy"]],["New Member Educator",["Armand Khchirian"]],["IFC Coordinator",["Rory Bushong"]],
 ["Social Media",["Phoenix Ho"]],["Retreat",["Brandon Fraser"]],["Philanthropy",["Jamison Wu"]]
].map(([pos,people])=>({pos,people}));

const GREEK = [["Alpha","Α α"],["Beta","Β β"],["Gamma","Γ γ"],["Delta","Δ δ"],["Epsilon","Ε ε"],["Zeta","Ζ ζ"],["Eta","Η η"],["Theta","Θ θ"],["Iota","Ι ι"],["Kappa","Κ κ"],["Lambda","Λ λ"],["Mu","Μ μ"],["Nu","Ν ν"],["Xi","Ξ ξ"],["Omicron","Ο ο"],["Pi","Π π"],["Rho","Ρ ρ"],["Sigma","Σ σ"],["Tau","Τ τ"],["Upsilon","Υ υ"],["Phi","Φ φ"],["Chi","Χ χ"],["Psi","Ψ ψ"],["Omega","Ω ω"]].map(([n,s])=>({n,s}));

const CREED = `To bind men together in a brotherhood based upon eternal and immutable principles,
with a bond as strong as right itself and as lasting as humanity;
to know no North, no South, no East, no West, but to know man as man;
to teach that true men the world over should stand together and contend for supremacy of good over evil;
to teach, not politics, but morals;
to foster, not partisanship, but the recognition of true merit wherever found;
to have no narrower limits within which to work together for the elevation of man than the outlines of the world:
these were the thoughts and hopes uppermost in the minds of the founders of the Alpha Tau Omega Fraternity.`;

const HISTORY = [
 {k:"Founded (date)", a:"September 11, 1865", d:["March 4, 1856","September 11, 1873","November 25, 1868"]},
 {k:"Founded (city)", a:"Richmond, Virginia", d:["Lexington, Kentucky","Charlottesville, Virginia","Philadelphia, Pennsylvania"]},
 {k:"Founded (school)", a:"Virginia Military Institute (VMI)", d:["University of Virginia","Washington and Lee","The Citadel"]},
 {k:"Founders", a:"Otis Allan Glazebrook, Alfred Marshall, Erskine Mayo Ross", d:["Otis Allan Glazebrook, William Bennett, Frederick Berlin","Alfred Marshall, Erskine Mayo Ross, Robert E. Lee","Otis Allan Glazebrook, Alfred Marshall, John Wise"]},
 {k:"Main founder / wrote the Creed", a:"Otis Allan Glazebrook", d:["Alfred Marshall","Erskine Mayo Ross","Frederick Berlin"]},
 {k:"Why founded", a:"To reunite the North and South after the Civil War", d:["To support VMI cadets during the war","To create a literary debate society","To unite fraternities across Virginia"]},
 {k:"Founding principles", a:"Christian, not Greek, principles", d:["Greek philosophical principles","Military honor code","Masonic principles"]},
 {k:"Colors", a:"Azure and Gold", d:["Blue and White","Navy and Silver","Crimson and Gold"]},
 {k:"Flower", a:"White Tea Rose", d:["Red Carnation","White Lily","Yellow Rose"]},
 {k:"Creed written", a:"1880", d:["1865","1900","1892"]},
];
const HIST_ID = {"Founded (date)":"When was ATΩ founded?","Founded (city)":"In what city was ATΩ founded?","Founded (school)":"ATΩ was founded by cadets of which school?","Founders":"Who are the three founders?","Main founder / wrote the Creed":"Which founder wrote the Creed and led the founding?","Why founded":"Why was ATΩ founded?","Founding principles":"ATΩ was founded upon…","Colors":"What are the official colors?","Flower":"What is the official flower?","Creed written":"What year was the Creed written?"};

/* ===================== STORAGE ===================== */
const LS = {get(k,d){try{const v=localStorage.getItem("ato_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem("ato_"+k,JSON.stringify(v))}catch(e){}}};
let BOX = LS.get("boxes",{});
const box = id => BOX[id]||0;
function grade(id,ok){BOX[id]= ok?Math.min(5,box(id)+1):0; LS.set("boxes",BOX)}

/* ===================== HELPERS ===================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sample = (a,n)=>shuffle(a).slice(0,n);
const norm = s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const close = (a,b)=>{a=norm(a);b=norm(b);return a===b||lev(a,b)<=Math.max(1,Math.floor(b.length/7))};
// match a typed name against a pool: full name, or unique first / last name
function matchName(input,pool){
  const t=norm(input); if(!t) return null;
  let hit=pool.find(p=>close(t,p)); if(hit) return hit;
  const byFirst=pool.filter(p=>close(t,norm(p).split(" ")[0])); if(byFirst.length===1) return byFirst[0];
  const byLast=pool.filter(p=>{const w=norm(p).split(" ");return close(t,w.slice(1).join(" "))||close(t,w[w.length-1])}); if(byLast.length===1) return byLast[0];
  return null;
}

/* ===================== QUESTION DECKS (all multiple choice, Leitner-tracked) ===================== */
const DECKS = {
 members:{label:"Who's in which class", build(){return ALL.map(p=>({id:"m:"+p.name,prompt:`Which pledge class is <b>${esc(p.name)}</b> in?`,options:ORDER.slice(),answer:p.cls,note:[p.major,p.home].filter(Boolean).join(" · "),keepOrder:true}))}},
 whois:{label:"Know your brothers", build(){return ALL.filter(p=>p.major||p.home).map(p=>{const cls=CLASSES.find(c=>c.name===p.cls).members.filter(x=>x.name!==p.name);return {id:"w:"+p.name,prompt:`${esc(p.cls)} · ${esc([p.major,p.home&&("from "+p.home)].filter(Boolean).join(" · "))}`,sub:"Who is this?",options:shuffle([p.name,...sample(cls,3).map(x=>x.name)]),answer:p.name}})}},
 exec:{label:"Exec board", build(){const qs=[];EXEC.forEach(e=>{const ans=e.people.join(", ");const others=sample(EXEC.filter(x=>x!==e),3).map(x=>x.people.join(", "));qs.push({id:"e:"+e.pos,prompt:`Who holds <b>${esc(e.pos)}</b>?`,options:shuffle([ans,...others]),answer:ans});e.people.forEach(p=>qs.push({id:"ep:"+p,prompt:`What exec position does <b>${esc(p)}</b> hold?`,options:shuffle([e.pos,...sample(EXEC.filter(x=>x!==e),3).map(x=>x.pos)]),answer:e.pos,note:"Pledge class: "+((ALL.find(x=>x.name===p)||{}).cls||"?")}))});return qs}},
 greek:{label:"Greek alphabet", build(){const qs=[];GREEK.forEach((g,i)=>{if(i<23){const nx=GREEK[i+1].n;qs.push({id:"gn:"+g.n,prompt:`What letter comes right after <b>${g.n}</b>?`,options:shuffle([nx,...sample(GREEK.filter(x=>x.n!==nx&&x.n!==g.n),3).map(x=>x.n)]),answer:nx})}
   if(i>0){const pv=GREEK[i-1].n;qs.push({id:"gp:"+g.n,prompt:`What letter comes right before <b>${g.n}</b>?`,options:shuffle([pv,...sample(GREEK.filter(x=>x.n!==pv&&x.n!==g.n),3).map(x=>x.n)]),answer:pv})}
   qs.push({id:"gs:"+g.n,prompt:`<span style="font-family:Georgia,serif;font-size:34px">${g.s}</span>`,sub:"Name this letter",options:shuffle([g.n,...sample(GREEK.filter(x=>x!==g),3).map(x=>x.n)]),answer:g.n})});return qs}},
 history:{label:"ATΩ history", build(){return HISTORY.map(h=>({id:"h:"+h.k,prompt:HIST_ID[h.k],options:shuffle([h.a,...h.d]),answer:h.a}))}},
 creed:{label:"Creed — next line", build(){const L=CREED.split("\n");return L.slice(0,-1).map((l,i)=>({id:"c:"+i,prompt:`“…${esc(l)}”`,sub:"What comes next?",options:shuffle([L[i+1],...sample(L.filter((_,j)=>j!==i+1&&j!==i),3)]),answer:L[i+1]}))}},
 order:{label:"Class order", build(){const qs=[];ORDER.forEach((c,i)=>{if(i<4)qs.push({id:"o:"+c,prompt:`Which class came right <b>before</b> ${c} (one older)?`,options:ORDER.filter(x=>x!==c),answer:ORDER[i+1],keepOrder:true})});return qs}},
};
function pick(deckKeys,last){
  const pool=deckKeys.flatMap(k=>DECKS[k].build());
  let cand=pool.filter(q=>q.id!==last);
  const minBox=Math.min(...cand.map(q=>box(q.id)));
  // prefer weakest items, with some randomness
  const weighted=cand.flatMap(q=>Array(Math.max(1,6-box(q.id)+(box(q.id)===minBox?3:0))).fill(q));
  return weighted[Math.random()*weighted.length|0];
}
function deckMastery(k){const qs=DECKS[k].build();return qs.reduce((s,q)=>s+box(q.id),0)/(qs.length*5)}

/* ===================== MC CARD (shared) ===================== */
function mcCard(el,{getQ,onDone,label,counter}){
  let q, last=null, streak=0, seen=0, right=0;
  function show(){
    q=getQ(last); last=q.id;
    el.innerHTML=`<div class="card"><div class="meta"><span>${esc(label)}</span><span>${counter?counter():`${right}/${seen} · streak ${streak}`}</span></div>
      <div class="q">${q.prompt}</div>${q.sub?`<div class="qsub">${q.sub}</div>`:""}
      <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  }
  function answer(b){
    const ok=q.options[+b.dataset.i]===q.answer; seen++; if(ok){right++;streak++}else streak=0;
    grade(q.id,ok);
    el.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.options[+x.dataset.i]===q.answer)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    const fb=el.querySelector("#fb");
    fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Correct.":"Answer: <b>"+esc(q.answer)+"</b>"}${q.note?` <span class="hint">· ${esc(q.note)}</span>`:""}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="nx">Next</button></div>`;
    if(onDone&&onDone(q,ok)===false) return;
    const nx=el.querySelector("#nx"); nx.onclick=show; nx.focus();
  }
  show();
}

  inp.focus();
}

/* ---------- MEMORIZER (creed, chant, song) ---------- */
function memorizer(st,key,text){
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  const lvl=LS.get("mlvl_"+key,"read"); let chunk=LS.get("mchunk_"+key,"all"); if(chunk!=="all"&&+chunk>=lines.length)chunk="all";
  const sel=chunk==="all"?lines:[lines[+chunk]];
  const LV=[["read","1 · Read"],["fade","2 · Fade"],["initials","3 · First letters"],["recite","4 · Recite"]];
  let seed=LS.get("mseed",1);
  const hideWord=(li,wi)=>((li*31+wi*17+seed*13)%10)<5;
  let body="";
  if(lvl==="read") body=`<div class="text">${sel.map(l=>`<p class="ln">${esc(l)}</p>`).join("")}</div><p class="hint">Read it out loud twice, then move to Fade.</p>`;
  if(lvl==="fade") body=`<div class="text">${sel.map((l,li)=>`<p class="ln">${l.split(/\s+/).map((w,wi)=>hideWord(li,wi)?`<span class="blank" tabindex="0">${esc(w)}</span>`:esc(w)).join(" ")}</p>`).join("")}</div><div class="row"><button class="btn ghost" id="reroll">Hide different words</button><span class="hint">Say it out loud. Tap a blank to peek.</span></div>`;
  if(lvl==="initials") body=`<div class="text ini">${sel.map(l=>`<p class="ln">${esc(l.split(/\s+/).map(w=>w.replace(/[A-Za-z'’]+/,m=>m[0])).join(" "))}</p>`).join("")}</div><p class="hint">Only first letters. Say every word from memory.</p>`;
  if(lvl==="recite") body=`<textarea id="rt" placeholder="Type it from memory. Punctuation and capitals don't count."></textarea><div class="row" style="margin-top:10px"><button class="btn" id="chk">Check</button><span class="hint">Best: ${LS.get("mbest_"+key+"_"+chunk,null)??"—"}${LS.get("mbest_"+key+"_"+chunk,null)!=null?"%":""}</span></div><div id="diff"></div>`;
  st.innerHTML=`<div class="chunks"><button data-ch="all" aria-pressed="${chunk==="all"}">Whole thing</button>${lines.map((_,i)=>`<button data-ch="${i}" aria-pressed="${String(i)===String(chunk)}">Line ${i+1}</button>`).join("")}</div>
  <div class="modes" style="margin-top:0">${LV.map(([k,l])=>`<button data-l="${k}" aria-pressed="${k===lvl}">${l}</button>`).join("")}</div>
  <div class="card">${body}</div>`;
  st.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{LS.set("mchunk_"+key,b.dataset.ch);memorizer(st,key,text)});
  st.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{LS.set("mlvl_"+key,b.dataset.l);memorizer(st,key,text)});
  st.querySelectorAll(".blank").forEach(b=>{b.onclick=()=>b.classList.toggle("show");b.onkeydown=e=>{if(e.key==="Enter")b.classList.toggle("show")}});
  const rr=st.querySelector("#reroll"); if(rr) rr.onclick=()=>{LS.set("mseed",seed+1);memorizer(st,key,text)};
  const ck=st.querySelector("#chk"); if(ck) ck.onclick=()=>{
    const target=sel.join(" ").split(/\s+/), tn=target.map(norm), typed=norm(st.querySelector("#rt").value).split(" ").filter(Boolean);
    const n=tn.length,m=typed.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
    for(let a=n-1;a>=0;a--)for(let b=m-1;b>=0;b--)D[a][b]=tn[a]===typed[b]?D[a+1][b+1]+1:Math.max(D[a+1][b],D[a][b+1]);
    let a=0,b=0,out=[],hits=0;
    while(a<n||b<m){if(a<n&&b<m&&tn[a]===typed[b]){out.push(`<span class="ok">${esc(target[a])}</span>`);hits++;a++;b++}
      else if(b<m&&(a>=n||D[a][b+1]>=D[a+1][b])){out.push(`<span class="extra">${esc(typed[b])}</span>`);b++}
      else{out.push(`<span class="miss">${esc(target[a])}</span>`);a++}}
    const extras=m-hits, pct=Math.max(0,Math.round(100*(hits-extras*0.5)/n));
    const prev=LS.get("mbest_"+key+"_"+chunk,0); if(pct>prev)LS.set("mbest_"+key+"_"+chunk,pct);
    if(key==="creed") sel.forEach(l=>{const i=lines.indexOf(l);if(i>0)grade("c:"+(i-1),pct>=95)});
    st.querySelector("#diff").innerHTML=`<div class="feedback ${pct>=95?"good":"bad"}">${pct}% · ${hits}/${n} words${extras?` · ${extras} extra`:""}</div>
    <div class="text diff" style="margin-top:10px">${out.join(" ")}</div>
    <p class="hint"><span style="color:var(--good)">green</span> = right · <span style="color:var(--bad);text-decoration:underline">red</span> = missed · <s>struck</s> = you added it</p>`;
  };
}

      <textarea id="sw" placeholder="${esc(s.starter)}">${esc(saved)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="ssave">Save and start drilling</button>${saved?`<button class="btn ghost" id="scancel">Cancel</button>`:""}</div></div>`;
      st.querySelector("#ssave").onclick=()=>{const v=st.querySelector("#sw").value.trim();if(!v)return;LS.set("text_"+m,v);LS.set("edit_"+m,false);render()};
      const c=st.querySelector("#scancel"); if(c) c.onclick=()=>{LS.set("edit_"+m,false);render()};
    } else {
      const holder=document.createElement("div"); st.appendChild(holder);
      memorizer(holder,"song_"+m,saved);
      const e=document.createElement("div");e.className="row";e.style.marginTop="10px";e.innerHTML=`<button class="btn ghost">Edit the words</button>`;st.appendChild(e);
      e.querySelector("button").onclick=()=>{LS.set("edit_"+m,true);render()};
    }
  });
}

/* ---------- MOCK MIDTERM ---------- */
function exam(){
  const mix={order:3,members:5,whois:2,exec:5,greek:4,history:5,creed:3};
  let qs=[];Object.entries(mix).forEach(([k,n])=>qs.push(...sample(DECKS[k].build(),n)));
  qs=shuffle(qs); let idx=0,right=0,misses=[];
  $("#main").innerHTML=`<h2>Mock midterm</h2><p class="hint">${qs.length} mixed questions across everything. Best so far: ${LS.get("examBest",null)??"—"}${LS.get("examBest",null)!=null?"%":""}</p><div id="stage"></div>`;
  const st=$("#stage");
  mcCard(st,{label:"Mock midterm",counter:()=>`Q ${idx+1} / ${qs.length}`,getQ:()=>qs[idx],
    onDone:(q,ok)=>{if(ok)right++;else misses.push(q);idx++;
      if(idx>=qs.length){const pct=Math.round(100*right/qs.length);if(window.__atoExamDone)window.__atoExamDone(pct);const b=LS.get("examBest",0);if(pct>b)LS.set("examBest",pct);
        const nx=st.querySelector("#nx");nx.textContent="See results";nx.onclick=()=>{
        st.innerHTML=`<div class="card"><div class="big">${pct}%</div><p>${right} / ${qs.length} correct${pct>b?" · new best":""}.</p>
        ${misses.length?`<h3>Re-drill these</h3><div style="display:grid;gap:8px">${misses.map(q=>`<div class="feedback bad"><div>${q.prompt}${q.sub?" "+q.sub:""}</div><b>${esc(q.answer)}</b></div>`).join("")}</div>`:"<p>Perfect run.</p>"}
        <div class="row" style="margin-top:14px"><button class="btn gold" id="retake">New midterm</button></div></div>`;
        st.querySelector("#retake").onclick=exam};return false}}});
}

<script>
/* ===================== ao26 BRIDGE =====================
   Only active when embedded by the site as /drill/index.html?me=<memberId>.
   Standalone (no ?me) this does nothing. It never touches the quiz logic:
   it watches LS.set and posts score patches to the parent window, which
   writes them to Firestore under the logged-in member (best-of, never down). */
(function(){
  const me=new URLSearchParams(location.search).get("me");
  if(!me||window.parent===window) return;
  const post=patch=>{try{window.parent.postMessage({type:"ato-drill",memberId:me,patch,at:Date.now()},location.origin)}catch(e){}};
  const DECK_KEYS=["order","members","whois","exec","greek","creed","history"];
  const mastery=()=>{const o={};DECK_KEYS.forEach(k=>o[k]=Math.round(deckMastery(k)*100));return o};
  // Mastery changes on every answer; post it at most once per 5 s (trailing).
  let mTimer=null,mDirty=false;
  const postMastery=()=>{mDirty=true;if(mTimer)return;mTimer=setTimeout(()=>{mTimer=null;if(mDirty){mDirty=false;post({mastery:mastery()})}},5000)};
  const origSet=LS.set.bind(LS);
  LS.set=(k,v)=>{origSet(k,v);
    if(k==="examBest")post({examBest:Math.round(v)});
    else if(k==="greekBest")post({greekBestMs:Math.round(v)});
    else if(k==="boxes")postMastery();
    else if(k==="mbest_creed_all")post({creedBest:Math.round(v)});
  };
  // Called by exam() with the score of every finished mock midterm, best or not.
  window.__atoExamDone=pct=>post({examLast:Math.round(pct),examAttempts:1});
  // On load, sync anything already earned on this device (e.g. from using the page standalone).
  const init={};
  const eb=LS.get("examBest",null); if(typeof eb==="number")init.examBest=Math.round(eb);
  const gb=LS.get("greekBest",null); if(typeof gb==="number")init.greekBestMs=Math.round(gb);
  const cb=LS.get("mbest_creed_all",null); if(typeof cb==="number")init.creedBest=Math.round(cb);
  const m=mastery(); if(DECK_KEYS.some(k=>m[k]>0))init.mastery=m;
  if(Object.keys(init).length)post(init);
})();
</script>
